modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Raspberry1111/create-hyperdrive/issues"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Raspberry1111/create-hyperdrive"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]] #optional
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sable"
type = "required"
versionRange = "[2.0,2.1)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "dimensional_sable"
type = "required"
versionRange = "[1.0,1.1.0)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "create_hyperdrive.mixins.json"
